# TEMPORAL: ¿qué responde Zonaprop a una IP de GitHub? Solo URLs genéricas.
name: diagnostico
on: workflow_dispatch
permissions: {}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          for u in https://www.zonaprop.com.ar/ https://www.zonaprop.com.ar/departamentos-alquiler.html; do
            curl -s -o body.html -D h.txt -w "CURL http=%{http_code} bytes=%{size_download} $u\n" -A "$UA" -H 'Accept-Language: es-AR,es;q=0.9' "$u"
            grep -iE '^(server|cf-ray|cf-mitigated):' h.txt || echo "(sin headers de cloudflare)"
            echo "state=$(grep -c '__PRELOADED_STATE__' body.html) title=$(grep -o '<title>[^<]*' body.html | head -1)"
          done
          python3 -m venv v && v/bin/pip -q install requests
          v/bin/python - <<'PY'
          import requests
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          r = requests.get('https://www.zonaprop.com.ar/departamentos-alquiler.html',
                           headers={'User-Agent': UA, 'Accept-Language': 'es-AR,es;q=0.9'}, timeout=20)
          print('REQUESTS http=%s bytes=%s state=%s server=%s cf-mitigated=%s' % (
              r.status_code, len(r.text), '__PRELOADED_STATE__' in r.text,
              r.headers.get('server'), r.headers.get('cf-mitigated')))
          PY
