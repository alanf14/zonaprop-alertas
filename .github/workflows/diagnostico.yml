# TEMPORAL: ¿MercadoLibre/Argenprop dejan leer desde una IP de GitHub? Solo URLs genéricas.
name: diagnostico
on: workflow_dispatch
permissions: {}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          for u in https://inmuebles.mercadolibre.com.ar/departamentos/alquiler/ https://api.mercadolibre.com/sites/MLA/search?category=MLA1459\&limit=1 https://www.argenprop.com/departamentos/alquiler; do
            curl -s -L -o b.html -D h.txt -w "DIAG http=%{http_code} bytes=%{size_download} $u\n" -A "$UA" -H 'Accept-Language: es-AR,es;q=0.9' "$u"
            grep -iE '^(server|x-amzn-waf-action|cf-mitigated):' h.txt | tr -d '\r' | sed 's/^/DIAG   /' || true
            echo "DIAG   initialState=$(grep -o initialState b.html | wc -l) results=$(grep -o '\"results\"' b.html | wc -l) body=$(head -c 120 b.html | tr -d '\n')"
          done
